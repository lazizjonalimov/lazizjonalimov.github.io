<!-- Contact -->
<section id="contact" class="section band">
    <div class="container contact-inner">
        <div class="contact-text">
            <h2 class="contact-title">Let's work together.</h2>
            <p class="contact-lead">Open to new roles, freelance projects and collaborations. Send a message or reach me directly.</p>
            <ul class="contact-links">
                <li><i class="fas fa-envelope" aria-hidden="true"></i><a href="mailto:lazizjonalimov@gmail.com">lazizjonalimov@gmail.com</a></li>
                <li><i class="fab fa-linkedin" aria-hidden="true"></i><a href="https://linkedin.com/in/lazizjonalimov/" target="_blank" rel="noopener noreferrer">linkedin.com/in/lazizjonalimov</a></li>
                <li><i class="fab fa-github" aria-hidden="true"></i><a href="https://github.com/lazizjonalimov" target="_blank" rel="noopener noreferrer">github.com/lazizjonalimov</a></li>
                <li><i class="fas fa-location-dot" aria-hidden="true"></i><span>United States</span></li>
            </ul>
        </div>
        <form class="contact-form" id="contact-form" novalidate>
            <div class="field-row">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
            </div>
            <div class="field">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn">
                <span class="btn-text">Send message</span>
                <i class="fas fa-spinner fa-spin btn-spinner" aria-hidden="true"></i>
            </button>
            <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
    </div>
</section>
